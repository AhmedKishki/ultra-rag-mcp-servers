name: Verify submodules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collection and child repositories
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify the collection layout
        shell: bash
        run: |
          git submodule status --recursive
          test -f research-rag/pyproject.toml
          test -f memory-rag/pyproject.toml

      - name: Check the collection scripts
        shell: bash
        run: |
          bash -n scripts/stop-servers.sh
          python3 -m py_compile scripts/collection_processes.py scripts/tests/test_stop_servers.py
          scripts/stop-servers.sh --dry-run

      - name: Run the collection automation tests
        shell: bash
        run: |
          python3 -m unittest discover \
            --start-directory scripts/tests \
            --top-level-directory scripts/tests
